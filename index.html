<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>irix05.github.io</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.9.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.0"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #vis { width: 50%; margin: 0 auto; }
  </style>
</head>
<body>
  <h1>irix05.github.io</h1>
  <div id="vis"></div>
  <script>
    const spec = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      title: "Sample Vega-Lite Chart",
      data: {
        values: [
          { category: "A", value: 12 },
          { category: "B", value: 20 },
          { category: "C", value: 15 },
          { category: "D", value: 25 },
          { category: "E", value: 18 },
          { category: "F", value: 30 },
          { category: "G", value: 22 },
          { category: "H", value: 28 }
        ]
      },
      mark: "bar",
      encoding: {
        x: { field: "category", type: "nominal", title: "Category" },
        y: { field: "value", type: "quantitative", title: "Value" }
      }
    };
    vegaEmbed("#vis", spec);
  </script>
</body>
</html>
