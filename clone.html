<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>irix05.github.io - Clone</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.9.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.0"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1b2a 0%, #1b2838 100%);
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      color: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #9ca3af;
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }
    .chart-card {
      width: 60%;
      max-width: 640px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
    }
    .chart-card h2 {
      font-size: 1.15rem;
      font-weight: 500;
      margin: 0 0 1rem;
      color: #c8c8d0;
      text-align: center;
    }
    #cloneChart {
      width: 100%;
      height: 360px;
    }
    @media (max-width: 768px) {
      .chart-card { width: 92%; }
      #cloneChart { height: 280px; }
    }
  </style>
</head>
<body>
  <h1>irix05.github.io - Clone</h1>
  <p class="subtitle">A standalone clone of the visualization</p>
  <div class="chart-card">
    <h2>The Long Road Ahead</h2>
    <div id="cloneChart"></div>
  </div>
  <script>
    fetch("vis.json")
      .then(r => r.json())
      .then(spec => vegaEmbed("#cloneChart", spec, { actions: false }));
  </script>
</body>
</html>
